<!-- admin_login.html — High-fidelity split-pane administrative login screen -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | MCCRRS</title>
    <!-- Modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Top Header Bar */
        .admin-login-header {
            background-color: #D9D9D9;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #C0C0C0;
            width: 100%;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-section img {
            height: 40px;
            width: 40px;
            object-fit: contain;
            border-radius: 50%;
        }
        .logo-section h1 {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
            color: #000;
        }
        /* Split Split Main Container */
        .admin-login-main {
            display: flex;
            flex: 1;
            width: 100%;
        }
        /* Left Half Visual Pane: Manila City Hall Facade Statue Background */
        .admin-login-left {
            flex: 1.1;
            background: url('/static/images/manila-hero.png') center/cover no-repeat;
            border-right: 1px solid #C0C0C0;
        }
        /* Right Half Form Pane */
        .admin-login-right {
            flex: 0.9;
            background-color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 60px;
        }
        .admin-login-card {
            width: 100%;
            max-width: 420px;
        }
        .admin-login-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
            color: #000000;
            margin-bottom: 12px;
        }
        .admin-login-subtitle {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #555555;
            margin-bottom: 32px;
        }
        /* Grey pill styled input boxes matching screenshot */
        .admin-input-group {
            margin-bottom: 16px;
        }
        .admin-input-group input {
            width: 100%;
            padding: 14px 20px;
            background-color: #D9D9D9;
            border: 1px solid #B0B0B0;
            border-radius: 24px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #333333;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .admin-input-group input::placeholder {
            color: #777777;
            font-weight: 600;
        }
        .admin-input-group input:focus {
            border-color: #000000;
            background-color: #E2E2E2;
        }
        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            background: none;
            color: #000000;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-top: 20px;
            transition: color 0.15s ease;
        }
        .btn-submit:hover {
            color: #555555;
        }
        .alert-error {
            background-color: #FFD2D2;
            color: #D8000C;
            border: 1px solid #D8000C;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 24px;
        }
        .security-hint {
            font-size: 0.75rem;
            color: #888888;
            margin-top: 6px;
            font-weight: 600;
            display: block;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header bar styled exactly like the user's User Homepage screenshot for unified brand consistency -->
    <header class="admin-login-header">
        <div class="logo-section">
            <img src="{{ url_for('static', filename='images/manila-logo.png') }}" alt="Manila Seal">
            <h1>CITY OF MANILA</h1>
        </div>
    </header>

    <!-- Main Split Section matching the visual layouts in Admin Homepage screenshot -->
    <main class="admin-login-main">
        <!-- Left Visual Side: Stunning view of Manila City Hall facade -->
        <div class="admin-login-left"></div>

        <!-- Right Input Side: Contains system titles, descriptions, and grey pill input forms -->
        <div class="admin-login-right">
            <div class="admin-login-card">
                
                <h1 class="admin-login-title">Community Concern<br>Reporting and Response<br>System</h1>
                <p class="admin-login-subtitle">Helping residents and local government respond faster and transparently</p>

                <!-- Display error flash alerts if credentials failed security validation -->
                {% if error %}
                <div class="alert-error">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('admin_login') }}">
                    <!-- Email input styled as a grey pill -->
                    <div class="admin-input-group">
                        <input type="email" id="email" name="email" placeholder="Enter Email" required>
                    </div>

                    <!-- Password input styled as a grey pill -->
                    <div class="admin-input-group">
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>

                    <!-- Security clearance code input styled as a grey pill -->
                    <div class="admin-input-group">
                        <input type="text" id="sec_number" name="sec_number" placeholder="Security Clearance Number" required>
                        <span class="security-hint">(Cleared keys: 11111A = Minor, 12121B = Major, 13131C = Critical)</span>
                    </div>

                    <!-- Sleek, centered text button for submission -->
                    <button type="submit" class="btn-submit">Log in</button>
                </form>

                <div style="text-align:center; margin-top:24px;">
                    <a href="{{ url_for('home') }}" style="font-size:0.85rem; font-weight:700; color:#555; text-decoration:none; transition:color 0.15s ease;">← Return to Resident Portal</a>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
